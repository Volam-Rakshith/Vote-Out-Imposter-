/* ==========================================================================
   VOTE OUT IMPOSTER — global design system
   Theme: emerald green for everything innocent/normal, red for imposter
   effects. Dark, neon-accented, mobile-first, accessible, heavily animated
   (all motion respects prefers-reduced-motion).
   No external fonts/CDNs — fully offline-capable.
   ========================================================================== */

:root {
  --bg: #04100b;
  --bg-2: #06140e;
  --surface: #081711;
  --card: rgba(255, 255, 255, 0.035);
  --card-hover: rgba(255, 255, 255, 0.06);
  --line: rgba(148, 163, 184, 0.16);
  --text: #e8eefb;
  --muted: #9aa7bd;
  --accent: #34d399;
  --accent-2: #f87171;
  --accent-3: #fb7185;
  --good: #34d399;
  --bad: #fb7185;
  --warn: #fbbf24;
  --glow: 0 0 24px rgba(52, 211, 153, 0.22);
  --glow-strong: 0 0 40px rgba(52, 211, 153, 0.38);
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --speed: 0.22s;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font);
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(248, 113, 113, 0.08), transparent 60%),
    radial-gradient(900px 460px at -10% 0%, rgba(52, 211, 153, 0.12), transparent 55%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* --- Accessibility --------------------------------------------------------- */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 200;
  background: var(--accent); color: #032015; padding: 10px 16px; border-radius: 0 0 10px 0; font-weight: 700;
}
.skip-link:focus { left: 0; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}

/* --- Layout ---------------------------------------------------------------- */
.app-shell { display: flex; flex-direction: column; min-height: 100vh; }
.container { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 18px; }
main#app { flex: 1; padding: 22px 0 90px; width: 100%; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.center { text-align: center; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.tiny { font-size: 0.78rem; }
.mono { font-family: var(--mono); letter-spacing: 0.06em; }

/* --- Top navigation ---------------------------------------------------------- */
.top-nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(5, 7, 13, 0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.top-nav .inner { display: flex; align-items: center; gap: 16px; padding: 12px 18px; max-width: 1080px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.brand .brand-name { font-weight: 800; letter-spacing: 0.04em; font-size: 0.95rem; }
.brand .brand-name span { color: var(--accent); }
.nav-links { display: flex; gap: 6px; margin-left: auto; }
.nav-link {
  padding: 8px 16px; border-radius: 999px; color: var(--muted); text-decoration: none;
  font-weight: 600; font-size: 0.92rem; border: 1px solid transparent; transition: all var(--speed);
}
.nav-link:hover { color: var(--text); background: var(--card); }
.nav-link.active { color: var(--accent); border-color: rgba(52, 211, 153, 0.4); background: rgba(52, 211, 153, 0.08); }

/* --- Bottom navigation (mobile) ----------------------------------------------- */
.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
  background: rgba(6, 9, 16, 0.94); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0));
}
.bottom-nav .inner { display: flex; }
.bottom-link {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px; color: var(--muted); text-decoration: none; font-size: 0.72rem; font-weight: 600;
  border-radius: 12px; min-height: 52px; justify-content: center;
}
.bottom-link.active { color: var(--accent); }
@media (max-width: 719px) {
  .bottom-nav { display: block; }
  .nav-links { display: none; }
  main#app { padding-bottom: 120px; }
}

/* --- Footer --------------------------------------------------------------------- */
.site-footer { border-top: 1px solid var(--line); padding: 18px; color: var(--muted); font-size: 0.8rem; text-align: center; }

/* --- Buttons ---------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 22px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font-family: var(--font);
  font-size: 0.98rem; font-weight: 700; cursor: pointer; text-decoration: none;
  transition: transform var(--speed), box-shadow var(--speed), background var(--speed), border-color var(--speed);
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.btn:hover:not(:disabled) { background: var(--card-hover); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0) scale(0.985); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary {
  background: linear-gradient(135deg, #059669, #34d399);
  border-color: rgba(52, 211, 153, 0.6); color: #032015;
  box-shadow: var(--glow);
}
.btn.primary:hover:not(:disabled) { box-shadow: var(--glow-strong); }
.btn.accent2 { background: linear-gradient(135deg, #dc2626, #f87171); border-color: rgba(248, 113, 113, 0.6); color: #2a0708; }
.btn.danger { background: rgba(251, 113, 133, 0.12); border-color: rgba(251, 113, 133, 0.5); color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 14px; font-size: 0.85rem; border-radius: 10px; }
.btn.tiny { min-height: 30px; padding: 3px 10px; font-size: 0.76rem; border-radius: 8px; }
.btn.block { width: 100%; }
.btn.big { min-height: 58px; font-size: 1.08rem; border-radius: 16px; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--muted); cursor: pointer; transition: all var(--speed);
}
.icon-btn:hover:not(:disabled) { color: var(--text); background: var(--card-hover); }
.icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* --- Cards ------------------------------------------------------------------------- */
.card {
  background: linear-gradient(180deg, var(--card), rgba(255, 255, 255, 0.015));
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow);
}
.card.tight { padding: 12px 14px; }
.section-title {
  display: flex; align-items: center; gap: 10px; font-size: 1.02rem; font-weight: 800;
  letter-spacing: 0.02em; margin: 0 0 4px;
}
.section-title svg { color: var(--accent); flex-shrink: 0; }
.section-sub { color: var(--muted); font-size: 0.84rem; margin: 0 0 12px; }

/* --- Hero / landing ------------------------------------------------------------------ */
.hero { padding: 34px 0 10px; text-align: center; }
.hero-art { margin: 0 auto 8px; max-width: 300px; filter: drop-shadow(0 0 26px rgba(52, 211, 153, 0.3)); }
.hero h1 {
  font-size: clamp(1.7rem, 5.4vw, 2.9rem); margin: 6px 0 6px; font-weight: 900; letter-spacing: 0.01em;
  background: linear-gradient(92deg, #e8eefb 15%, var(--accent) 50%, var(--accent-2) 85%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero .tagline { color: var(--muted); font-size: clamp(0.95rem, 2.6vw, 1.1rem); margin: 0 auto 18px; max-width: 640px; }
.brand-line { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }

.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 8px; }
.mode-card {
  text-align: left; display: flex; flex-direction: column; gap: 10px; cursor: pointer;
  background: linear-gradient(180deg, var(--card), rgba(255, 255, 255, 0.012));
  border: 1px solid var(--line); border-radius: 18px; padding: 22px; color: var(--text);
  transition: transform var(--speed), border-color var(--speed), box-shadow var(--speed);
}
.mode-card:hover:not(.disabled) { transform: translateY(-3px); border-color: rgba(52, 211, 153, 0.45); box-shadow: var(--glow); }
.mode-card.disabled { opacity: 0.6; cursor: not-allowed; }
.mode-card .mode-icon {
  width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
  background: rgba(52, 211, 153, 0.1); color: var(--accent); border: 1px solid rgba(52, 211, 153, 0.3);
}
.mode-card.alt .mode-icon { background: rgba(248, 113, 113, 0.12); color: var(--accent-2); border-color: rgba(248, 113, 113, 0.35); }
.mode-card h3 { margin: 0; font-size: 1.14rem; }
.mode-card p { margin: 0; color: var(--muted); font-size: 0.88rem; }

/* --- Forms ---------------------------------------------------------------------------- */
label.field-label { display: block; font-weight: 700; font-size: 0.84rem; margin: 12px 0 6px; color: var(--text); }
.input, select.input, textarea.input {
  width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(3, 6, 12, 0.7); color: var(--text);
  font-family: var(--font); font-size: 0.98rem; transition: border-color var(--speed), box-shadow var(--speed);
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15); }
.input::placeholder { color: #5b6b84; }
.field-error { color: var(--bad); font-size: 0.82rem; margin-top: 5px; display: flex; gap: 6px; align-items: flex-start; }
.field-hint { color: var(--muted); font-size: 0.8rem; margin-top: 5px; }
.input.invalid { border-color: rgba(251, 113, 133, 0.6); }

/* Chips */
.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  font-size: 0.86rem; font-weight: 600; cursor: pointer; transition: all var(--speed);
  -webkit-tap-highlight-color: transparent; min-height: 38px;
}
.chip:hover { color: var(--text); }
.chip.selected {
  color: #032015; background: linear-gradient(135deg, #059669, var(--accent));
  border-color: rgba(52, 211, 153, 0.65); box-shadow: 0 0 14px rgba(52, 211, 153, 0.25);
}
.chip.selected .chip-check { display: inline-flex; }
.chip-check { display: none; color: #032015; }

/* Radio cards */
.radio-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.radio-card {
  position: relative; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card);
  cursor: pointer; transition: all var(--speed); color: var(--text); text-align: left;
}
.radio-card:hover { background: var(--card-hover); }
.radio-card.selected { border-color: rgba(52, 211, 153, 0.6); background: rgba(52, 211, 153, 0.08); box-shadow: 0 0 16px rgba(52, 211, 153, 0.15); }
.radio-card .rc-title { font-weight: 800; font-size: 0.94rem; }
.radio-card .rc-sub { font-size: 0.76rem; color: var(--muted); }
.radio-card input { position: absolute; opacity: 0; pointer-events: none; }

/* Toggle switch */
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.toggle-row + .toggle-row { border-top: 1px dashed var(--line); }
.toggle-text { display: flex; flex-direction: column; gap: 2px; }
.toggle-text .t-title { font-weight: 700; font-size: 0.92rem; }
.toggle-text .t-sub { color: var(--muted); font-size: 0.78rem; }
.switch { position: relative; width: 52px; height: 30px; flex-shrink: 0; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track {
  position: absolute; inset: 0; border-radius: 999px; background: rgba(148, 163, 184, 0.25);
  border: 1px solid var(--line); transition: background var(--speed);
}
.switch .thumb {
  position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: #cbd5e1; transition: transform var(--speed), background var(--speed);
}
.switch input:checked ~ .track { background: rgba(52, 211, 153, 0.45); border-color: rgba(52, 211, 153, 0.6); }
.switch input:checked ~ .thumb { transform: translateX(22px); background: var(--accent); }
.switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Stepper */
.stepper { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button {
  width: 42px; height: 42px; background: var(--card); color: var(--text); border: 0;
  font-size: 1.2rem; cursor: pointer; font-weight: 700;
}
.stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
.stepper .value { min-width: 56px; text-align: center; font-weight: 800; font-family: var(--mono); }

/* Range slider */
input[type="range"] { width: 100%; accent-color: var(--accent); height: 34px; }

/* --- Player list -------------------------------------------------------------------------- */
.player-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--card); transition: border-color var(--speed), box-shadow var(--speed);
}
.player-row.dragging { opacity: 0.45; border-style: dashed; }
.player-row.drag-over { border-color: var(--accent); box-shadow: 0 0 12px rgba(52, 211, 153, 0.2); }
.player-row .drag-handle { cursor: grab; color: var(--muted); display: grid; place-items: center; width: 28px; }
.player-row .p-num {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
  background: rgba(52, 211, 153, 0.12); color: var(--accent); font-weight: 800; font-size: 0.82rem;
}
.player-row .input { min-height: 40px; }
.recent-chip { border-style: dashed; }

/* --- Badges / banners ------------------------------------------------------------------------ */
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: 0.74rem; font-weight: 800; letter-spacing: 0.03em;
  background: rgba(148, 163, 184, 0.14); color: var(--muted); border: 1px solid var(--line);
}
.badge.good { background: rgba(52, 211, 153, 0.14); color: var(--good); border-color: rgba(52, 211, 153, 0.4); }
.badge.bad { background: rgba(251, 113, 133, 0.12); color: var(--bad); border-color: rgba(251, 113, 133, 0.4); }
.badge.warn { background: rgba(251, 191, 36, 0.12); color: var(--warn); border-color: rgba(251, 191, 36, 0.4); }
.badge.accent { background: rgba(52, 211, 153, 0.12); color: var(--accent); border-color: rgba(52, 211, 153, 0.4); }
.badge.host { background: rgba(251, 191, 36, 0.15); color: var(--warn); border-color: rgba(251, 191, 36, 0.45); }

.banner {
  display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--card); font-size: 0.9rem;
}
.banner.info { border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.07); }
.banner.warn { border-color: rgba(251, 191, 36, 0.4); background: rgba(251, 191, 36, 0.07); }
.banner.bad { border-color: rgba(251, 113, 133, 0.4); background: rgba(251, 113, 133, 0.07); }
.banner svg { flex-shrink: 0; margin-top: 2px; }

/* --- Game phase UI ------------------------------------------------------------------------------ */
.phase-header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--line);
  background: linear-gradient(90deg, rgba(52, 211, 153, 0.07), rgba(248, 113, 113, 0.05));
}
.phase-header .ph-title { font-weight: 900; font-size: 1.05rem; display: flex; align-items: center; gap: 9px; }
.phase-header .ph-title svg { color: var(--accent); }

.pass-card {
  text-align: center; padding: 34px 20px; border-radius: 22px;
  border: 1px dashed rgba(52, 211, 153, 0.4); background: radial-gradient(400px 200px at 50% 0%, rgba(52, 211, 153, 0.08), transparent);
}
.pass-card .pass-name { font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 900; margin: 8px 0 4px; }
.pass-card .pass-note { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }

.role-card {
  text-align: center; padding: 30px 22px; border-radius: 22px; position: relative; overflow: hidden;
  animation: roleReveal 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
.role-card.innocent { border: 1px solid rgba(52, 211, 153, 0.55); background: radial-gradient(420px 220px at 50% -10%, rgba(52, 211, 153, 0.16), transparent), var(--surface); }
.role-card.imposter { border: 1px solid rgba(251, 113, 133, 0.55); background: radial-gradient(420px 220px at 50% -10%, rgba(251, 113, 133, 0.16), transparent), var(--surface); }
.role-card.chaos { border: 1px solid rgba(248, 113, 113, 0.6); background: radial-gradient(420px 220px at 50% -10%, rgba(248, 113, 113, 0.18), transparent), var(--surface); }
.role-card .role-name { font-size: clamp(1.5rem, 6vw, 2.2rem); font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; }
.role-card.innocent .role-name { color: var(--good); }
.role-card.imposter .role-name { color: var(--bad); }
.role-card.chaos .role-name { color: var(--accent-2); }
.role-card .role-icon { margin-bottom: 6px; }
.word-display {
  font-family: var(--mono); font-size: clamp(1.5rem, 7vw, 2.6rem); font-weight: 800; letter-spacing: 0.04em;
  padding: 18px 16px; margin: 16px 0 6px; border-radius: 16px; text-transform: uppercase;
  background: rgba(3, 6, 12, 0.65); border: 1px solid rgba(52, 211, 153, 0.4); color: var(--good);
  word-break: break-word; box-shadow: inset 0 0 30px rgba(52, 211, 153, 0.08);
}
@keyframes roleReveal { from { opacity: 0; transform: scale(0.86) translateY(14px); } to { opacity: 1; transform: none; } }

/* Timer ring */
.timer-wrap { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
.timer-wrap svg { transform: rotate(-90deg); }
.timer-wrap .timer-num {
  position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 1.25rem;
  font-family: var(--mono);
}
.timer-wrap.urgent .timer-num { color: var(--bad); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }

/* Candidate / voting */
.candidate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.candidate {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 10px;
  border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--card);
  cursor: pointer; transition: all var(--speed); font-weight: 700; color: var(--text); min-height: 86px; justify-content: center;
}
.candidate:hover:not(:disabled) { border-color: rgba(52, 211, 153, 0.5); background: var(--card-hover); }
.candidate.selected { border-color: var(--accent); background: rgba(52, 211, 153, 0.1); box-shadow: var(--glow); }
.candidate:disabled { opacity: 0.5; cursor: not-allowed; }
.candidate .avatar {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 900;
  background: linear-gradient(135deg, rgba(52, 211, 153, 0.25), rgba(248, 113, 113, 0.25));
  border: 1px solid var(--line); font-size: 1rem;
}

/* Tally bars */
.tally-row { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 34px; gap: 10px; align-items: center; padding: 6px 0; }
.tally-name { font-weight: 700; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tally-track { height: 22px; border-radius: 999px; background: rgba(148, 163, 184, 0.12); overflow: hidden; border: 1px solid var(--line); }
.tally-fill {
  height: 100%; border-radius: 999px; background: linear-gradient(90deg, #059669, var(--accent));
  transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 0 12px rgba(52, 211, 153, 0.35);
}
.tally-fill.top { background: linear-gradient(90deg, #e0483f, var(--bad)); box-shadow: 0 0 12px rgba(251, 113, 133, 0.4); }
.tally-count { font-family: var(--mono); font-weight: 800; text-align: right; }

/* Result banners */
.result-banner {
  text-align: center; padding: 26px 18px; border-radius: 20px; border: 1px solid var(--line);
  animation: roleReveal 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.15);
}
.result-banner.innocents { border-color: rgba(52, 211, 153, 0.55); background: radial-gradient(400px 200px at 50% 0%, rgba(52, 211, 153, 0.15), transparent), var(--surface); }
.result-banner.imposters { border-color: rgba(251, 113, 133, 0.55); background: radial-gradient(400px 200px at 50% 0%, rgba(251, 113, 133, 0.15), transparent), var(--surface); }
.result-banner.draw { border-color: rgba(148, 163, 184, 0.4); }
.result-banner.chaos { border-color: rgba(248, 113, 113, 0.6); background: radial-gradient(400px 200px at 50% 0%, rgba(248, 113, 113, 0.16), transparent), var(--surface); }
.result-banner .r-title { font-size: clamp(1.4rem, 5.5vw, 2rem); font-weight: 900; letter-spacing: 0.06em; }

/* Tables */
.mini-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.mini-table th { text-align: left; color: var(--muted); font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.mini-table td { padding: 8px 10px; border-bottom: 1px solid rgba(148, 163, 184, 0.09); }
.mini-table tr:last-child td { border-bottom: 0; }

/* Room code display */
.room-code-box {
  display: flex; align-items: center; justify-content: center; gap: 14px; padding: 18px;
  border-radius: 18px; border: 1px dashed rgba(52, 211, 153, 0.5);
  background: radial-gradient(400px 160px at 50% 0%, rgba(52, 211, 153, 0.1), transparent);
}
.room-code { font-family: var(--mono); font-size: clamp(1.9rem, 8vw, 3rem); font-weight: 900; letter-spacing: 0.28em; color: var(--accent); text-indent: 0.28em; }

/* Connection status */
.conn-pill {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px;
  font-size: 0.78rem; font-weight: 700; border: 1px solid var(--line); background: var(--card);
}
.conn-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.conn-pill.offline .conn-dot { background: var(--bad); box-shadow: 0 0 8px var(--bad); animation: pulse 1.2s infinite; }
.conn-pill.connecting .conn-dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 0.8s infinite; }

/* --- Toasts ------------------------------------------------------------------------------ */
#toasts {
  position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 120;
  display: flex; flex-direction: column; gap: 8px; width: min(94vw, 420px); pointer-events: none;
}
#toasts { bottom: 24px; }
.toast {
  pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 12px 16px;
  border-radius: 12px; background: rgba(10, 15, 26, 0.96); border: 1px solid var(--line);
  box-shadow: var(--shadow); font-size: 0.9rem; font-weight: 600;
  animation: toastIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}
.toast.good { border-color: rgba(52, 211, 153, 0.5); }
.toast.bad { border-color: rgba(251, 113, 133, 0.5); }
.toast.leaving { opacity: 0; transition: opacity 0.35s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: none; } }

/* --- Modal --------------------------------------------------------------------------------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 140; display: grid; place-items: center; padding: 18px;
  background: rgba(2, 4, 9, 0.75); backdrop-filter: blur(6px); animation: fadeIn 0.2s;
}
.modal {
  width: min(94vw, 480px); max-height: 86vh; overflow: auto; padding: 22px;
  border-radius: 18px; border: 1px solid var(--line); background: var(--bg-2); box-shadow: var(--shadow);
  animation: modalIn 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}
.modal h3 { margin: 0 0 8px; font-size: 1.15rem; }
.modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes modalIn { from { opacity: 0; transform: scale(0.94) translateY(10px); } to { opacity: 1; transform: none; } }

/* --- Progress dots -------------------------------------------------------------------------- */
.progress-dots { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: rgba(148, 163, 184, 0.25); border: 1px solid var(--line); }
.dot.on { background: var(--accent); box-shadow: 0 0 8px rgba(52, 211, 153, 0.6); }
.dot.done { background: rgba(52, 211, 153, 0.7); }

/* --- How-to steps ------------------------------------------------------------------------------- */
.steps { counter-reset: step; display: flex; flex-direction: column; gap: 10px; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step::before {
  counter-increment: step; content: counter(step);
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
  background: rgba(52, 211, 153, 0.14); color: var(--accent); font-weight: 900; font-size: 0.85rem;
  border: 1px solid rgba(52, 211, 153, 0.35);
}
.step .s-body { font-size: 0.9rem; color: var(--muted); padding-top: 3px; }
.step .s-body b { color: var(--text); }

/* --- Misc ----------------------------------------------------------------------------- */
.divider { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
details.faq { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); padding: 4px 14px; margin-bottom: 8px; }
details.faq summary { cursor: pointer; font-weight: 700; padding: 10px 0; list-style: none; display: flex; align-items: center; gap: 8px; }
details.faq summary::-webkit-details-marker { display: none; }
details.faq summary::after { content: "+"; margin-left: auto; color: var(--accent); font-weight: 900; }
details.faq[open] summary::after { content: "–"; }
details.faq .faq-body { color: var(--muted); font-size: 0.88rem; padding: 0 0 12px; }

.screen-enter { animation: screenIn 0.28s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.shake { animation: shake 0.4s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

.confetti-word { animation: popWord 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
@keyframes popWord { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.avatar-sm {
  width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; flex-shrink: 0;
  background: linear-gradient(135deg, rgba(52, 211, 153, 0.25), rgba(248, 113, 113, 0.25));
  border: 1px solid var(--line); font-weight: 800; font-size: 0.78rem;
}
.offline-dim { opacity: 0.45; }

/* ==========================================================================
   VOTE OUT IMPOSTER — VFX & MOTION LAYER
   Heavier animation pass: living background, dramatic reveals, staggered
   entrances, sheen sweeps, glow pulses. Green = normal/innocent, red =
   imposter. Every animation here is neutralised by the global
   prefers-reduced-motion rule at the top of this file.
   ========================================================================== */

/* --- Living aurora background --------------------------------------------------- */
body::before {
  content: "";
  position: fixed; inset: -20%;
  z-index: -1; pointer-events: none;
  background:
    radial-gradient(46% 38% at 24% 28%, rgba(52, 211, 153, 0.14), transparent 70%),
    radial-gradient(40% 34% at 78% 22%, rgba(248, 113, 113, 0.09), transparent 70%),
    radial-gradient(44% 40% at 62% 82%, rgba(5, 150, 105, 0.10), transparent 70%);
  animation: auroraDrift 26s ease-in-out infinite alternate;
}
@keyframes auroraDrift {
  0%   { transform: translate3d(-2%, -1%, 0) rotate(0.4deg) scale(1); }
  50%  { transform: translate3d(1.5%, 2%, 0) rotate(-0.5deg) scale(1.04); }
  100% { transform: translate3d(-1%, 1.5%, 0) rotate(0.3deg) scale(1.01); }
}

/* --- Screen & section entrances --------------------------------------------------- */
.screen-enter { animation: screenInVfx 0.42s cubic-bezier(0.2, 0.9, 0.25, 1); }
@keyframes screenInVfx {
  from { opacity: 0; transform: translateY(16px) scale(0.985); filter: blur(6px); }
  to   { opacity: 1; transform: none; filter: blur(0); }
}
.card { animation: cardIn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1) backwards; }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

/* --- Buttons: sheen sweep + breathing glow ---------------------------------------- */
.btn.primary { position: relative; overflow: hidden; animation: primaryBreathe 3.2s ease-in-out infinite; }
.btn.primary::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: -80%; width: 45%;
  background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.34), transparent);
  transform: skewX(-18deg); animation: sheenSweep 4.6s ease-in-out infinite;
}
@keyframes sheenSweep { 0%, 55% { left: -80%; } 85%, 100% { left: 140%; } }
@keyframes primaryBreathe {
  0%, 100% { box-shadow: 0 0 18px rgba(52, 211, 153, 0.25); }
  50%      { box-shadow: 0 0 34px rgba(52, 211, 153, 0.45); }
}
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn:active:not(:disabled) { transform: translateY(0) scale(0.97); }

/* --- Brand ------------------------------------------------------------------------
.brand-name span { animation: brandGlow 3s ease-in-out infinite; }
@keyframes brandGlow {
  0%, 100% { text-shadow: 0 0 8px rgba(248, 113, 113, 0.45); }
  50%      { text-shadow: 0 0 20px rgba(248, 113, 113, 0.85); }
}
.hero-art { animation: heroFloat 5.5s ease-in-out infinite; }
@keyframes heroFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-9px); }
}

/* --- Role cards: dramatic flip-in + aura -------------------------------------------- */
.role-card {
  animation: roleFlip 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.12) backwards, roleAura 2.8s ease-in-out 0.7s infinite;
}
@keyframes roleFlip {
  from { opacity: 0; transform: perspective(900px) rotateY(-14deg) scale(0.9) translateY(18px); }
  to   { opacity: 1; transform: none; }
}
.role-card.innocent { animation-name: roleFlip, roleAuraInnocent; }
.role-card.imposter { animation-name: roleFlip, roleAuraImposter; }
.role-card.chaos    { animation-name: roleFlip, roleAuraImposter; }
@keyframes roleAuraInnocent {
  0%, 100% { box-shadow: 0 0 22px rgba(52, 211, 153, 0.18), var(--shadow); }
  50%      { box-shadow: 0 0 46px rgba(52, 211, 153, 0.34), var(--shadow); }
}
@keyframes roleAuraImposter {
  0%, 100% { box-shadow: 0 0 22px rgba(251, 113, 133, 0.18), var(--shadow); }
  50%      { box-shadow: 0 0 46px rgba(251, 113, 133, 0.36), var(--shadow); }
}
.role-card .role-name { text-shadow: 0 0 18px rgba(255, 255, 255, 0.22); }
.role-card .role-icon { animation: roleIconPop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.35) 0.15s backwards; }
@keyframes roleIconPop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* --- Word display: glow pulse -------------------------------------------------- */
.word-display {
  animation: wordGlow 2.6s ease-in-out infinite;
  background: rgba(3, 12, 8, 0.72);
}
@keyframes wordGlow {
  0%, 100% { box-shadow: inset 0 0 26px rgba(52, 211, 153, 0.09), 0 0 14px rgba(52, 211, 153, 0.10); border-color: rgba(52, 211, 153, 0.42); }
  50%      { box-shadow: inset 0 0 40px rgba(52, 211, 153, 0.16), 0 0 26px rgba(52, 211, 153, 0.22); border-color: rgba(52, 211, 153, 0.7); }
}
.confetti-word { animation: popWordVfx 0.75s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
@keyframes popWordVfx {
  0%   { transform: scale(0.4) rotate(-3deg); opacity: 0; filter: blur(8px); }
  60%  { transform: scale(1.06) rotate(0.5deg); opacity: 1; filter: blur(0); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

/* --- Imposter hint pill (red mystery) --------------------------------------------- */
.hint-pill {
  margin: 14px 0 4px; padding: 14px 16px; border-radius: 14px; text-align: center;
  border: 1.5px dashed rgba(251, 113, 133, 0.55);
  background: radial-gradient(220px 90px at 50% 0%, rgba(251, 113, 133, 0.13), rgba(251, 113, 133, 0.04));
  animation: hintPulse 2.4s ease-in-out infinite;
}
@keyframes hintPulse {
  0%, 100% { box-shadow: 0 0 12px rgba(251, 113, 133, 0.14); border-color: rgba(251, 113, 133, 0.5); }
  50%      { box-shadow: 0 0 30px rgba(251, 113, 133, 0.30); border-color: rgba(251, 113, 133, 0.85); }
}
.hint-pill .hint-label {
  display: inline-flex; align-items: center; gap: 6px; font-size: 0.68rem; font-weight: 800;
  letter-spacing: 0.16em; color: var(--bad); text-transform: uppercase;
}
.hint-pill .hint-word {
  font-family: var(--mono); font-size: clamp(1.2rem, 5.4vw, 1.9rem); font-weight: 900;
  letter-spacing: 0.05em; text-transform: uppercase; color: #fda4af; margin-top: 6px;
  text-shadow: 0 0 16px rgba(251, 113, 133, 0.5);
  animation: hintWordIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.3) 0.25s backwards;
}
@keyframes hintWordIn { from { opacity: 0; transform: translateY(8px) scale(0.85); } to { opacity: 1; transform: none; } }
.hint-pill.none { border-style: solid; animation: none; }
.hint-pill.none span { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
.hint-reveal { color: #fda4af; text-shadow: 0 0 12px rgba(251, 113, 133, 0.4); }

/* --- Pass device card ------------------------------------------------------------- */
.pass-card { animation: passIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.08); }
@keyframes passIn {
  from { opacity: 0; transform: translateY(26px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}
.pass-card .pass-name { animation: popWordVfx 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.25) 0.1s backwards; }

/* --- Candidates: staggered pop-in + selection ring ---------------------------------- */
.candidate { animation: candidateIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards; }
.candidate:nth-child(1) { animation-delay: 0.03s; } .candidate:nth-child(2) { animation-delay: 0.08s; }
.candidate:nth-child(3) { animation-delay: 0.13s; } .candidate:nth-child(4) { animation-delay: 0.18s; }
.candidate:nth-child(5) { animation-delay: 0.23s; } .candidate:nth-child(6) { animation-delay: 0.28s; }
.candidate:nth-child(7) { animation-delay: 0.33s; } .candidate:nth-child(8) { animation-delay: 0.38s; }
.candidate:nth-child(n+9) { animation-delay: 0.43s; }
@keyframes candidateIn { from { opacity: 0; transform: translateY(14px) scale(0.92); } to { opacity: 1; transform: none; } }
.candidate:hover:not(:disabled) { transform: translateY(-3px); }
.candidate.selected { animation: candidateSelected 1.8s ease-in-out infinite; }
@keyframes candidateSelected {
  0%, 100% { box-shadow: 0 0 14px rgba(52, 211, 153, 0.28); }
  50%      { box-shadow: 0 0 30px rgba(52, 211, 153, 0.5); }
}

/* --- Tally bars: shimmering fill ---------------------------------------------------- */
.tally-fill { position: relative; overflow: hidden; }
.tally-fill::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.28) 50%, transparent 80%);
  transform: translateX(-100%); animation: tallyShimmer 1.8s ease-in-out 0.25s infinite;
}
@keyframes tallyShimmer { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }
.tally-fill.top::after {
  background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.36) 50%, transparent 80%);
}

/* --- Result banners: pop + shine ---------------------------------------------------- */
.result-banner { position: relative; overflow: hidden; }
.result-banner::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: -70%; width: 35%;
  background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.13), transparent);
  transform: skewX(-16deg); animation: sheenSweep 3.4s ease-in-out 0.6s infinite;
}
.result-banner .r-title { animation: popWordVfx 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.3) 0.15s backwards; }
.result-banner.imposters { animation: roleFlip 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.12), roleAuraImposter 2.6s ease-in-out 0.7s infinite; }
.result-banner.innocents { animation: roleFlip 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.12), roleAuraInnocent 2.6s ease-in-out 0.7s infinite; }

/* --- Phase header: slide + shimmer --------------------------------------------------- */
.phase-header { animation: phaseIn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1); }
@keyframes phaseIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
.phase-header .ph-title svg { animation: phaseIconSpin 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.3) backwards; }
@keyframes phaseIconSpin { from { transform: rotate(-120deg) scale(0.3); opacity: 0; } to { transform: none; opacity: 1; } }

/* --- Progress dots --------------------------------------------------------------------- */
.dot { transition: background 0.3s, box-shadow 0.3s, transform 0.3s; }
.dot.on { animation: dotPulse 1.4s ease-in-out infinite; }
@keyframes dotPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 8px rgba(52, 211, 153, 0.55); }
  50%      { transform: scale(1.35); box-shadow: 0 0 16px rgba(52, 211, 153, 0.9); }
}

/* --- Chips / radio cards / mode cards ---------------------------------------------------- */
.chip.selected { animation: chipPop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
@keyframes chipPop { 50% { transform: scale(1.06); } }
.radio-card.selected { animation: chipPop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
.mode-card:hover:not(.disabled) .mode-icon { animation: modeIconBob 0.7s ease-in-out infinite; }
@keyframes modeIconBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.mode-card.alt .mode-icon { background: rgba(248, 113, 113, 0.1); color: var(--accent-2); border-color: rgba(248, 113, 113, 0.35); }

/* --- Avatars: green→red gradient ---------------------------------------------------------- */
.avatar, .avatar-sm { background: linear-gradient(135deg, rgba(52, 211, 153, 0.28), rgba(248, 113, 113, 0.28)); }
.player-row .p-num { background: rgba(52, 211, 153, 0.14); }

/* --- Timer urgency -------------------------------------------------------------------------- */
.timer-wrap.urgent { animation: urgentShake 1.4s ease-in-out infinite; }
@keyframes urgentShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-2px); } 40% { transform: translateX(2px); }
  60% { transform: translateX(-1px); } 80% { transform: translateX(1px); }
}

/* --- Toasts: spring entrance ------------------------------------------------------------------ */
.toast { animation: toastInVfx 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.35); }
@keyframes toastInVfx {
  from { opacity: 0; transform: translateY(26px) scale(0.92); }
  60%  { transform: translateY(-4px) scale(1.02); }
  to   { opacity: 1; transform: none; }
}

/* --- Connection dot ---------------------------------------------------------------------------- */
.conn-dot { animation: connBeat 2.2s ease-in-out infinite; }
@keyframes connBeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }

/* --- Steps --------------------------------------------------------------------------------------- */
.step { animation: cardIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) backwards; }
.step:nth-child(1) { animation-delay: 0.05s; } .step:nth-child(2) { animation-delay: 0.13s; }
.step:nth-child(3) { animation-delay: 0.21s; } .step:nth-child(4) { animation-delay: 0.29s; }

/* --- Room code ------------------------------------------------------------------------------------ */
.room-code { animation: roomCodeGlow 3s ease-in-out infinite; }
@keyframes roomCodeGlow {
  0%, 100% { text-shadow: 0 0 10px rgba(52, 211, 153, 0.35); }
  50%      { text-shadow: 0 0 26px rgba(52, 211, 153, 0.75); }
}

/* --- Per-player speaking mode ------------------------------------------------------------ */
.speaking-card { border-color: rgba(52, 211, 153, 0.45); animation: cardIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1); }
.speaking-card .speak-name {
  font-size: clamp(1.5rem, 6vw, 2.3rem); font-weight: 900; letter-spacing: 0.02em;
  color: var(--good); text-shadow: 0 0 18px rgba(52, 211, 153, 0.35);
  animation: popWordVfx 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.25) 0.05s backwards;
}
/* MY turn (online): the card itself pulses green */
.speaking-card.my-turn {
  border-color: rgba(52, 211, 153, 0.85);
  animation: cardIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), myTurnPulse 1.6s ease-in-out 0.4s infinite;
}
@keyframes myTurnPulse {
  0%, 100% { box-shadow: 0 0 16px rgba(52, 211, 153, 0.22), var(--shadow); }
  50%      { box-shadow: 0 0 42px rgba(52, 211, 153, 0.5), var(--shadow); }
}

  </style>
